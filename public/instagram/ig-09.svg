  <!-- Panel de alarmas inferior -->
  <rect x="110" y="535" width="690" height="155" rx="2" fill="#050008" stroke="#3D1045" stroke-width="1"/>
  <text x="130" y="555" font-family="monospace" font-size="8" fill="#9B7A97">ALARMAS ACTIVAS</text>
  <g font-family="monospace" font-size="8">
    <rect x="120" y="562" width="8" height="8" rx="1" fill="#F59E0B"/>
    <text x="135" y="571" fill="#F59E0B">10:42:18 — PRESIÓN ALTA TK-01 — 4.2 bar (límite 4.0)</text>
    <rect x="120" y="580" width="8" height="8" rx="1" fill="#22C55E"/>
    <text x="135" y="589" fill="#22C55E">09:15:44 — P-101 ARRANCADA MANUAL</text>
    <rect x="120" y="598" width="8" height="8" rx="1" fill="#9B7A97"/>
    <text x="135" y="607" fill="#9B7A97">08:30:00 — INICIO TURNO MAÑANA</text>
  </g>
  <!-- Variables lado derecho -->
  <rect x="760" y="535" width="40" height="155" fill="#050008"/>
  <text x="780" y="610" font-family="monospace" font-size="7" fill="#7D3A72" text-anchor="middle" writing-mode="tb">INSTRUMENTACIÓN</text>
  <!-- Teclado HMI inferior -->
  <rect x="200" y="720" width="500" height="80" rx="4" fill="#3D1045" stroke="#5B1D58" stroke-width="1"/>
  <g fill="#2D003A" stroke="#5B1D58" stroke-width="0.5">
    <rect x="220" y="735" width="40" height="30" rx="2"/>
    <rect x="268" y="735" width="40" height="30" rx="2"/>
    <rect x="316" y="735" width="40" height="30" rx="2"/>
    <rect x="364" y="735" width="40" height="30" rx="2"/>
    <rect x="412" y="735" width="40" height="30" rx="2"/>
    <rect x="460" y="735" width="40" height="30" rx="2"/>
    <rect x="508" y="735" width="80" height="30" rx="2"/>
    <rect x="596" y="735" width="80" height="30" rx="2"/>
  </g>
  <text x="240" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">F1</text>
  <text x="288" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">F2</text>
  <text x="336" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">F3</text>
  <text x="384" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">F4</text>
  <text x="432" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">ESC</text>
  <text x="480" y="755" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">ENT</text>
  <text x="548" y="755" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">ALARM ACK</text>
  <text x="636" y="755" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">MAINT MODE</text>
  <text x="450" y="850" font-family="monospace" font-size="12" fill="#7D3A72" text-anchor="middle">CONTROL SCADA — ingelec.argentina</text>
</svg>
