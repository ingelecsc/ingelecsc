    <line x1="440" y1="630" x2="440" y2="670"/>
    <line x1="460" y1="630" x2="460" y2="670"/>
    <line x1="480" y1="630" x2="480" y2="670"/>
    <line x1="500" y1="630" x2="500" y2="670"/>
    <line x1="520" y1="630" x2="520" y2="670"/>
