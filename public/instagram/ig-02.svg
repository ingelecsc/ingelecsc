    <path d="M 125 80 L 125 1100" stroke="#5B1D58" opacity="0.9"/>
    <path d="M 140 80 L 140 1100" stroke="#9B7A97" opacity="0.7"/>
    <path d="M 155 80 L 155 1100" stroke="#7D3A72" opacity="0.6"/>
    <path d="M 170 80 L 170 1100" stroke="#5B1D58" opacity="0.8"/>
