<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#1A0020"/>
  <!-- PLC Siemens S7-1200 close-up -->
  <rect x="150" y="100" width="600" height="700" rx="4" fill="#2D003A" stroke="#7D3A72" stroke-width="2"/>
  <!-- CPU module -->
  <rect x="170" y="130" width="180" height="440" rx="3" fill="#3D1045" stroke="#5B1D58" stroke-width="1.5"/>
  <!-- CPU label -->
  <rect x="185" y="145" width="150" height="30" rx="2" fill="#1A0020"/>
  <text x="260" y="165" font-family="monospace" font-size="9" fill="#7D3A72" text-anchor="middle">CPU 1214C</text>
  <text x="260" y="178" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">DC/DC/DC</text>
  <!-- RUN/STOP LEDs -->
  <circle cx="195" cy="205" r="6" fill="#22C55E"/>
  <circle cx="195" cy="225" r="6" fill="#EF4444" opacity="0.2"/>
  <circle cx="195" cy="245" r="6" fill="#F59E0B" opacity="0.3"/>
  <text x="210" y="209" font-family="monospace" font-size="7" fill="#9B7A97">RUN</text>
  <text x="210" y="229" font-family="monospace" font-size="7" fill="#9B7A97">STOP</text>
  <text x="210" y="249" font-family="monospace" font-size="7" fill="#9B7A97">ERROR</text>
  <!-- Ethernet port -->
  <rect x="185" y="270" width="50" height="35" rx="2" fill="#1A0020" stroke="#7D3A72" stroke-width="1"/>
  <text x="210" y="292" font-family="monospace" font-size="7" fill="#7D3A72" text-anchor="middle">LAN</text>
  <!-- Digital inputs -->
  <rect x="185" y="325" width="145" height="80" rx="2" fill="#1A0020" stroke="#5B1D58" stroke-width="1"/>
  <text x="258" y="342" font-family="monospace" font-size="7" fill="#9B7A97" text-anchor="middle">DIGITAL IN (14)</text>
  <g fill="#22C55E">
    <circle cx="200" cy="358" r="3"/>
    <circle cx="215" cy="358" r="3"/>
    <circle cx="230" cy="358" r="3"/>
    <circle cx="245" cy="358" r="3"/>
    <circle cx="260" cy="358" r="3"/>
    <circle cx="275" cy="358" r="3"/>
    <circle cx="290" cy="358" r="3"/>
    <circle cx="305" cy="358" r="3"/>
    <circle cx="200" cy="375" r="3"/>
    <circle cx="215" cy="375" r="3"/>
    <circle cx="230" cy="375" r="3"/>
    <circle cx="245" cy="375" r="3"/>
    <circle cx="260" cy="375" r="3"/>
    <circle cx="275" cy="375" r="3" fill="#F59E0B"/>
  </g>
  <!-- IO module 1 -->
  <rect x="360" y="130" width="100" height="440" rx="3" fill="#3D1045" stroke="#5B1D58" stroke-width="1.5"/>
  <text x="410" y="160" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">SM 1221</text>
  <text x="410" y="175" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">DI 16</text>
  <g fill="#22C55E">
    <circle cx="380" cy="200" r="4"/>
    <circle cx="400" cy="200" r="4"/>
    <circle cx="420" cy="200" r="4"/>
    <circle cx="440" cy="200" r="4"/>
    <circle cx="380" cy="220" r="4"/>
    <circle cx="400" cy="220" r="4"/>
    <circle cx="420" cy="220" r="4" fill="#EF4444"/>
    <circle cx="440" cy="220" r="4"/>
    <circle cx="380" cy="240" r="4"/>
    <circle cx="400" cy="240" r="4"/>
    <circle cx="420" cy="240" r="4"/>
    <circle cx="440" cy="240" r="4"/>
    <circle cx="380" cy="260" r="4"/>
    <circle cx="400" cy="260" r="4"/>
    <circle cx="420" cy="260" r="4"/>
    <circle cx="440" cy="260" r="4"/>
  </g>
  <!-- IO module 2 -->
  <rect x="470" y="130" width="100" height="440" rx="3" fill="#3D1045" stroke="#5B1D58" stroke-width="1.5"/>
  <text x="520" y="160" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">SM 1222</text>
  <text x="520" y="175" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">DQ 16</text>
  <g fill="#7D3A72">
    <circle cx="490" cy="200" r="4"/>
    <circle cx="510" cy="200" r="4"/>
    <circle cx="530" cy="200" r="4"/>
    <circle cx="550" cy="200" r="4"/>
    <circle cx="490" cy="220" r="4"/>
    <circle cx="510" cy="220" r="4"/>
    <circle cx="530" cy="220" r="4" fill="#22C55E"/>
    <circle cx="550" cy="220" r="4"/>
    <circle cx="490" cy="240" r="4"/>
    <circle cx="510" cy="240" r="4"/>
    <circle cx="530" cy="240" r="4"/>
    <circle cx="550" cy="240" r="4"/>
    <circle cx="490" cy="260" r="4"/>
    <circle cx="510" cy="260" r="4"/>
    <circle cx="530" cy="260" r="4"/>
    <circle cx="550" cy="260" r="4"/>
  </g>
  <!-- IO module 3 -->
  <rect x="580" y="130" width="100" height="440" rx="3" fill="#3D1045" stroke="#5B1D58" stroke-width="1.5"/>
  <text x="630" y="160" font-family="monospace" font-size="8" fill="#7D3A72" text-anchor="middle">SM 1231</text>
  <text x="630" y="175" font-family="monospace" font-size="7" fill="#5B1D58" text-anchor="middle">AI 8</text>
  <!-- Analog bars -->
  <g fill="#7D3A72" opacity="0.7">
    <rect x="595" y="320" width="12" height="60" rx="1"/>
    <rect x="612" y="340" width="12" height="40" rx="1"/>
    <rect x="629" y="300" width="12" height="80" rx="1"/>
    <rect x="646" y="330" width="12" height="50" rx="1"/>
    <rect x="663" y="350" width="12" height="30" rx="1"/>
    <rect x="680" y="310" width="12" height="70" rx="1"/>
  </g>
  <!-- Bus connector -->
  <rect x="162" y="580" width="556" height="20" rx="2" fill="#5B1D58"/>
  <!-- Bottom terminals -->
  <rect x="170" y="610" width="560" height="40" rx="2" fill="#1A0020" stroke="#3D1045" stroke-width="1"/>
  <g stroke="#7D3A72" stroke-width="1">
    <line x1="185" y1="610" x2="185" y2="650"/><line x1="200" y1="610" x2="200" y2="650"/>
    <line x1="215" y1="610" x2="215" y2="650"/><line x1="230" y1="610" x2="230" y2="650"/>
    <line x1="245" y1="610" x2="245" y2="650"/><line x1="260" y1="610" x2="260" y2="650"/>
    <line x1="275" y1="610" x2="275" y2="650"/><line x1="290" y1="610" x2="290" y2="650"/>
    <line x1="305" y1="610" x2="305" y2="650"/><line x1="320" y1="610" x2="320" y2="650"/>
    <line x1="335" y1="610" x2="335" y2="650"/><line x1="350" y1="610" x2="350" y2="650"/>
    <line x1="365" y1="610" x2="365" y2="650"/><line x1="380" y1="610" x2="380" y2="650"/>
  </g>
  <text x="450" y="790" font-family="monospace" font-size="12" fill="#7D3A72" text-anchor="middle">AUTOMATIZACIÓN PLC — ingelec.argentina</text>
</svg>
